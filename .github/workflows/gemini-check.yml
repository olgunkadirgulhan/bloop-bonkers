name: gemini-check
# Tek seferlik: GEMINI_API_KEY çalışıyor mu (değeri yazdırmaz)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          code=$(curl -s -o r.json -w "%{http_code}" -H "x-goog-api-key: $K" -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" \
            -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}]}')
          echo "HTTP $code"; python3 -c "import json;d=json.load(open('r.json'));print(d.get('error',{}).get('message','')[:200] or 'yanıt: '+d['candidates'][0]['content']['parts'][0]['text'][:30])"
