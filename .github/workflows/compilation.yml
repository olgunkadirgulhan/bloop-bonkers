name: compilation
# Haftalık derleme (uzun video, 4.000 saat izlenme süresi için): son 7 günün en iyi Shorts'ları #7 → #1
on:
  schedule:
    - cron: "0 17 * * 0"   # pazar 17:00 UTC (New York 13:00)
  workflow_dispatch:
    inputs:
      privacy:
        description: Boş = YT_PRIVACY değişkeni (public), deneme için private
        type: choice
        options: ["", private, public]
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Derle ve yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY }}
        run: python compile.py
      - name: Keep for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compilation-${{ github.run_id }}
          path: output/compilation-*/compilation.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "bloop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "compilation: $(date -u +%F)"
          git pull --rebase
          git push
