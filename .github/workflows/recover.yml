name: recover
on:
  workflow_dispatch:
    inputs:
      video:
        description: video id
        required: true
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/recover_episode.py ${{ inputs.video }}
      - run: |
          git config user.name "bloop-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json; git diff --cached --quiet && exit 0
          git commit -m "recover episode ${{ inputs.video }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
