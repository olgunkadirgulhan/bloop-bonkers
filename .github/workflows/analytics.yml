name: analytics
# Sadece okuma: bölümlerin ve son Shorts'ların izlenme süresi / elde tutma oranı
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Video id'leri (boşsa tüm bölümler + son 8 Short)
        default: ""
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: python tools/analytics.py ${{ inputs.ids }}
