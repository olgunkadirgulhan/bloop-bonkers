name: episode
# Uzun bölüm (yatay): her durum bölümde bir kez; günde 2 (16:00 + 22:00 UTC; kullanıcı kararı 2026-10-13). episode.py: günde en fazla 2, aralarında en az 3 saat
on:
  schedule:
    - cron: "0 17 * * 1,3,5"   # 2026-10-20: haftada 3 (uzun bölümler 112-290 izlenme; kullanıcı onayı)
    - cron: "30 18 * * 1,3,5"  # yedek; bölüm çıktıysa episode.py atlar
  workflow_dispatch:
    inputs:
      privacy:
        description: Boş = YT_PRIVACY değişkeni (public), deneme için private
        type: choice
        options: ["", private, public]
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bölümü üret ve yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY }}   # 2026-10-11: 1. bölüm ilk gün 1.786 izlenme → haftada 2 herkese açık
        run: python episode.py
      - name: Keep for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: episode-${{ github.run_id }}
          path: |
            output/episode-*/episode.mp4
            output/episode-*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "bloop-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 tools/push_state.py "episode: $(date -u +%F)" history.json playlists.json
